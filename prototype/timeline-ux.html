<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>klex — Мобильный таймлайн (Issue #9 Прототип UX)</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151d2f;
      --card-active: #1e293b;
      --border: #243049;
      --text: #f8fafc;
      --text-muted: #8493a8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #f43f5e;
      --track-bg: #1e293b;
      --track-clip: #3b82f6;
      --track-clip-active: #60a5fa;
      --playhead: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top App Bar */
    .top-bar {
      height: 44px;
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 20;
    }
    .app-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #2563eb; padding: 2px 6px; border-radius: 4px; }

    /* Main Container */
    #app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Video Stage */
    .stage-container {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .video-viewport {
      position: relative;
      background: linear-gradient(145deg, #1e1b4b, #0f172a);
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-mock-bg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.2);
      font-size: 13px;
      pointer-events: none;
    }
    .playhead-time-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      color: #fff;
      z-index: 10;
    }

    /* Text Layer on Stage */
    .stage-layer {
      position: absolute;
      cursor: move;
      touch-action: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      z-index: 5;
    }
    .stage-layer.selected {
      outline: 2px dashed #60a5fa;
      outline-offset: 4px;
    }
    .stage-layer-content {
      display: inline-block;
      line-height: 1.2;
    }

    /* Floating Switcher */
    .variant-switcher {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 30px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .variant-btn {
      background: #334155;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .variant-label { font-size: 12px; font-weight: 600; color: #38bdf8; }

    /* Controls & Toolbars */
    .action-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn.primary { background: var(--primary); border-color: transparent; }

    /* Bottom Inspector Sheet */
    .inspector-panel {
      background: #0f172a;
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 15;
    }
    .style-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
    }
    .color-swatch.active { border-color: #fff; transform: scale(1.15); }
    .toggle-chip {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .toggle-chip.active { background: #2563eb; color: #fff; border-color: transparent; }

    /* ==========================================================================
       VARIANT A: CAPCUT / REELS CLASSIC (Horizontal Multi-track Timeline)
       ========================================================================== */
    .var-a-timeline {
      height: 220px;
      background: #0b1120;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .timeline-ruler {
      height: 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }
    .timeline-tracks-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding: 8px 0;
    }
    .timeline-track-row {
      height: 38px;
      margin-bottom: 6px;
      position: relative;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 4px;
    }
    .timeline-clip {
      position: absolute;
      top: 2px;
      bottom: 2px;
      background: #2563eb;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      touch-action: none;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timeline-clip.active {
      background: #3b82f6;
      box-shadow: 0 0 0 2px #fff;
    }
    .clip-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 14px;
      background: rgba(255,255,255,0.4);
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clip-handle::after {
      content: '';
      width: 2px;
      height: 12px;
      background: #fff;
      border-radius: 1px;
    }
    .clip-handle.left { left: 0; border-radius: 6px 0 0 6px; }
    .clip-handle.right { right: 0; border-radius: 0 6px 6px 0; }

    .playhead-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--playhead);
      z-index: 30;
      pointer-events: none;
    }
    .playhead-handle {
      position: absolute;
      top: 0;
      left: -6px;
      width: 14px;
      height: 16px;
      background: var(--playhead);
      clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);
    }

    /* ==========================================================================
       VARIANT B: STORIES OVERLAY (Clean Full Video + Mini Chip Scrubber)
       ========================================================================== */
    .var-b-container {
      position: absolute;
      bottom: 60px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 25;
    }
    .var-b-layer-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px;
    }
    .var-b-chip {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .var-b-chip.active { background: var(--primary); border-color: #fff; font-weight: 600; }
    .var-b-master-scrub {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scrub-track {
      height: 10px;
      background: #334155;
      border-radius: 5px;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }
    .scrub-active-range {
      position: absolute;
      top: 0;
      bottom: 0;
      background: #3b82f6;
      border-radius: 5px;
    }
    .scrub-thumb {
      position: absolute;
      top: -5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transform: translateX(-50%);
    }

    /* ==========================================================================
       VARIANT C: SPLIT STAGE & CARDS (Draggable Divider + List Mode)
       ========================================================================== */
    .var-c-split {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .var-c-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f172a;
    }
    .var-c-card {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .var-c-card.active { border-color: #3b82f6; background: #1e293b; }
    .var-c-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .step-btn {
      background: #334155;
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Simulated Mobile Keyboard Modal */
    .keyboard-modal {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 260px;
      background: #1e293b;
      border-top: 2px solid #3b82f6;
      display: none;
      flex-direction: column;
      z-index: 50;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
    }
    .keyboard-modal.open { display: flex; }
    .keyboard-input-row {
      padding: 10px;
      background: #0f172a;
      display: flex;
      gap: 8px;
    }
    .keyboard-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .keyboard-keys-mock {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="app-title">
      <span>klex</span>
      <span class="badge">UX Prototype #9</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="action-btn" id="btn-toggle-keyboard">⌨️ Клавиатура</button>
      <button class="action-btn primary" id="btn-add-layer">+ Надпись</button>
    </div>
  </div>

  <div id="app-container">
    <!-- Video Stage (Shared) -->
    <div class="stage-container" id="stage-container">
      <div class="video-viewport" id="video-viewport" style="width: 225px; height: 400px;">
        <div class="video-mock-bg">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <div style="margin-top: 8px;">1080×1920 (9:16)</div>
        </div>
        <div class="playhead-time-overlay" id="playhead-overlay">00:00.00 / 00:30.00</div>
        
        <!-- Rendered layers will be injected here -->
        <div id="stage-layers-mount"></div>
      </div>
    </div>

    <!-- Inspector Sheet (Styles) -->
    <div class="inspector-panel" id="inspector-panel">
      <div class="style-row">
        <span style="font-size: 11px; color: var(--text-muted); width: 45px;">Цвет:</span>
        <div class="color-swatch active" style="background: #FFFFFF;" data-color="#FFFFFF"></div>
        <div class="color-swatch" style="background: #FEF08A;" data-color="#FEF08A"></div>
        <div class="color-swatch" style="background: #F87171;" data-color="#F87171"></div>
        <div class="color-swatch" style="background: #38BDF8;" data-color="#38BDF8"></div>
        <div class="color-swatch" style="background: #4ADE80;" data-color="#4ADE80"></div>
        <div class="color-swatch" style="background: #A855F7;" data-color="#A855F7"></div>
        <div class="color-swatch" style="background: #000000;" data-color="#000000"></div>
      </div>
      <div class="style-row">
        <button class="toggle-chip active" id="toggle-plate">Плашка: Вкл</button>
        <button class="toggle-chip" id="toggle-stroke">Обводка: Выкл</button>
        <button class="toggle-chip active" id="toggle-fade">Fade 1.0s: Вкл</button>
        <button class="toggle-chip" id="btn-font-switch">Шрифт: Sans</button>
      </div>
    </div>

    <!-- Timeline Container (Variant Swapped) -->
    <div id="timeline-mount"></div>

    <!-- Simulated Soft Keyboard -->
    <div class="keyboard-modal" id="keyboard-modal">
      <div class="keyboard-input-row">
        <input type="text" class="keyboard-input" id="keyboard-input-field" placeholder="Введите текст...">
        <button class="action-btn primary" id="btn-keyboard-done">Готово</button>
      </div>
      <div class="keyboard-keys-mock">
        📱 Симуляция экранной клавиатуры мобильного (260px)
      </div>
    </div>
  </div>

  <!-- Floating Prototype Switcher -->
  <div class="variant-switcher">
    <button class="variant-btn" id="var-prev">←</button>
    <span class="variant-label" id="var-title">A — CapCut Classic</span>
    <button class="variant-btn" id="var-next">→</button>
  </div>

  <script>
    // State Model
    const DURATION = 30.0; // 30 seconds project
    let currentVariant = 'A';
    let playhead = 2.0; // Current time in seconds
    let activeLayerId = 1;
    let isDraggingPlayhead = false;
    let isKeyboardOpen = false;

    let layers = [
      { id: 1, text: "Привет, Reels! 👋", x: 50, y: 35, start: 0.0, end: 8.0, color: "#FFFFFF", plate: true, stroke: false, fade: true, font: 'sans-serif' },
      { id: 2, text: "Смотри до конца 🔥", x: 50, y: 70, start: 6.0, end: 20.0, color: "#FEF08A", plate: true, stroke: false, fade: true, font: 'sans-serif' },
      { id: 3, text: "Подпишись ❤️", x: 50, y: 85, start: 18.0, end: 30.0, color: "#F87171", plate: true, stroke: true, fade: true, font: 'sans-serif' },
    ];

    const variants = [
      { key: 'A', name: 'A — CapCut Classic (Многодорожечный)' },
      { key: 'B', name: 'B — Stories Overlay (Чистый скраббер)' },
      { key: 'C', name: 'C — Split Stage & Cards (Карточки)' }
    ];

    // Formatting time MM:SS.ms
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function getActiveLayer() {
      return layers.find(l => l.id === activeLayerId) || layers[0];
    }

    // Render Layers on Video Preview Stage
    function renderStage() {
      const mount = document.getElementById('stage-layers-mount');
      mount.innerHTML = '';
      document.getElementById('playhead-overlay').textContent = `${formatTime(playhead)} / ${formatTime(DURATION)}`;

      layers.forEach(layer => {
        // Check if visible at current playhead
        const isVisible = playhead >= layer.start && playhead <= layer.end;
        if (!isVisible) return;

        // Calculate Fade
        let opacity = 1.0;
        if (layer.fade) {
          if (playhead < layer.start + 1.0) {
            opacity = Math.max(0, (playhead - layer.start) / 1.0);
          } else if (playhead > layer.end - 1.0) {
            opacity = Math.max(0, (layer.end - playhead) / 1.0);
          }
        }

        const el = document.createElement('div');
        el.className = `stage-layer ${layer.id === activeLayerId ? 'selected' : ''}`;
        el.style.left = `${layer.x}%`;
        el.style.top = `${layer.y}%`;
        el.style.opacity = opacity;

        const content = document.createElement('div');
        content.className = 'stage-layer-content';
        content.textContent = layer.text;
        content.style.color = layer.color;
        content.style.fontFamily = layer.font;
        content.style.fontSize = '18px';
        content.style.fontWeight = 'bold';

        if (layer.plate) {
          content.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
          content.style.padding = '4px 8px';
          content.style.borderRadius = '4px';
        }
        if (layer.stroke) {
          content.style.textShadow = '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000';
        }

        // Drag layer on video
        let startX, startY, initialLayerX, initialLayerY;
        el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          activeLayerId = layer.id;
          renderApp();

          const viewport = document.getElementById('video-viewport').getBoundingClientRect();
          startX = e.clientX;
          startY = e.clientY;
          initialLayerX = layer.x;
          initialLayerY = layer.y;

          function onPointerMove(me) {
            const dx = ((me.clientX - startX) / viewport.width) * 100;
            const dy = ((me.clientY - startY) / viewport.height) * 100;
            layer.x = Math.min(90, Math.max(10, initialLayerX + dx));
            layer.y = Math.min(90, Math.max(10, initialLayerY + dy));
            el.style.left = `${layer.x}%`;
            el.style.top = `${layer.y}%`;
          }

          function onPointerUp() {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
          }

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        });

        el.appendChild(content);
        mount.appendChild(el);
      });
    }

    // Render Timeline according to active variant
    function renderTimeline() {
      const mount = document.getElementById('timeline-mount');
      mount.innerHTML = '';

      if (currentVariant === 'A') {
        renderVariantA(mount);
      } else if (currentVariant === 'B') {
        renderVariantB(mount);
      } else if (currentVariant === 'C') {
        renderVariantC(mount);
      }
    }

    // =========================================================================
    // VARIANT A: CAPCUT CLASSIC
    // =========================================================================
    function renderVariantA(container) {
      const wrap = document.createElement('div');
      wrap.className = 'var-a-timeline';

      // Ruler
      const ruler = document.createElement('div');
      ruler.className = 'timeline-ruler';
      ruler.innerHTML = `
        <div style="display: flex; justify-content: space-between; padding: 4px 12px;">
          <span>00:00</span><span>00:10</span><span>00:20</span><span>00:30</span>
        </div>
      `;
      wrap.appendChild(ruler);

      // Tracks container
      const tracksScroll = document.createElement('div');
      tracksScroll.className = 'timeline-tracks-scroll';

      layers.forEach((layer) => {
        const row = document.createElement('div');
        row.className = 'timeline-track-row';

        const clip = document.createElement('div');
        clip.className = `timeline-clip ${layer.id === activeLayerId ? 'active' : ''}`;
        const leftPct = (layer.start / DURATION) * 100;
        const widthPct = ((layer.end - layer.start) / DURATION) * 100;
        clip.style.left = `${leftPct}%`;
        clip.style.width = `${widthPct}%`;
        clip.textContent = layer.text;

        clip.addEventListener('click', (e) => {
          e.stopPropagation();
          activeLayerId = layer.id;
          renderApp();
        });

        // Left Handle
        const leftHandle = document.createElement('div');
        leftHandle.className = 'clip-handle left';
        leftHandle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const startX = e.clientX;
          const initialStart = layer.start;
          const rowRect = row.getBoundingClientRect();

          function onMove(me) {
            const dt = ((me.clientX - startX) / rowRect.width) * DURATION;
            layer.start = Math.max(0, Math.min(layer.end - 0.5, initialStart + dt));
            renderApp();
          }
          function onUp() {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
          }
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });

        // Right Handle
        const rightHandle = document.createElement('div');
        rightHandle.className = 'clip-handle right';
        rightHandle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const startX = e.clientX;
          const initialEnd = layer.end;
          const rowRect = row.getBoundingClientRect();

          function onMove(me) {
            const dt = ((me.clientX - startX) / rowRect.width) * DURATION;
            layer.end = Math.min(DURATION, Math.max(layer.start + 0.5, initialEnd + dt));
            renderApp();
          }
          function onUp() {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
          }
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });

        clip.appendChild(leftHandle);
        clip.appendChild(rightHandle);
        row.appendChild(clip);
        tracksScroll.appendChild(row);
      });

      // Playhead
      const playheadLine = document.createElement('div');
      playheadLine.className = 'playhead-line';
      const playheadPct = (playhead / DURATION) * 100;
      playheadLine.style.left = `${playheadPct}%`;
      playheadLine.innerHTML = `<div class="playhead-handle"></div>`;
      wrap.appendChild(playheadLine);

      // Scrubbing on Timeline
      wrap.addEventListener('pointerdown', (e) => {
        const rect = wrap.getBoundingClientRect();
        function updatePlayhead(me) {
          const pct = Math.max(0, Math.min(1, (me.clientX - rect.left) / rect.width));
          playhead = Math.round(pct * DURATION * 10) / 10; // coarse tune step 0.1s
          renderApp();
        }
        updatePlayhead(e);

        function onMove(me) { updatePlayhead(me); }
        function onUp() {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      wrap.appendChild(tracksScroll);
      container.appendChild(wrap);
    }

    // =========================================================================
    // VARIANT B: STORIES OVERLAY
    // =========================================================================
    function renderVariantB(container) {
      const wrap = document.createElement('div');
      wrap.className = 'var-b-container';

      // Layer Chips Row
      const chipsRow = document.createElement('div');
      chipsRow.className = 'var-b-layer-chips';
      layers.forEach(layer => {
        const chip = document.createElement('div');
        chip.className = `var-b-chip ${layer.id === activeLayerId ? 'active' : ''}`;
        chip.innerHTML = `<span>💬</span> <span>${layer.text.substring(0, 14)}...</span>`;
        chip.addEventListener('click', () => {
          activeLayerId = layer.id;
          playhead = layer.start; // Jump to layer start on tap
          renderApp();
        });
        chipsRow.appendChild(chip);
      });
      wrap.appendChild(chipsRow);

      // Master Scrubber
      const master = document.createElement('div');
      master.className = 'var-b-master-scrub';

      const activeLayer = getActiveLayer();
      master.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
          <span>Скраб кадра: <strong>${formatTime(playhead)}</strong></span>
          <span>Слой: ${activeLayer.start.toFixed(1)}с – ${activeLayer.end.toFixed(1)}с</span>
        </div>
      `;

      const scrubTrack = document.createElement('div');
      scrubTrack.className = 'scrub-track';

      // Active Layer Range Bar
      const rangeBar = document.createElement('div');
      rangeBar.className = 'scrub-active-range';
      rangeBar.style.left = `${(activeLayer.start / DURATION) * 100}%`;
      rangeBar.style.width = `${((activeLayer.end - activeLayer.start) / DURATION) * 100}%`;
      scrubTrack.appendChild(rangeBar);

      // Thumb
      const thumb = document.createElement('div');
      thumb.className = 'scrub-thumb';
      thumb.style.left = `${(playhead / DURATION) * 100}%`;
      scrubTrack.appendChild(thumb);

      scrubTrack.addEventListener('pointerdown', (e) => {
        const rect = scrubTrack.getBoundingClientRect();
        function update(me) {
          const pct = Math.max(0, Math.min(1, (me.clientX - rect.left) / rect.width));
          playhead = Math.round(pct * DURATION * 10) / 10;
          renderApp();
        }
        update(e);
        function onMove(me) { update(me); }
        function onUp() {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      master.appendChild(scrubTrack);
      wrap.appendChild(master);
      container.appendChild(wrap);
    }

    // =========================================================================
    // VARIANT C: SPLIT STAGE & CARDS
    // =========================================================================
    function renderVariantC(container) {
      const wrap = document.createElement('div');
      wrap.className = 'var-c-split';

      // Scrubber strip
      const scrubStrip = document.createElement('div');
      scrubStrip.style.padding = '8px 12px';
      scrubStrip.style.background = '#0b1120';
      scrubStrip.style.borderBottom = '1px solid var(--border)';
      scrubStrip.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;">
          <span>Скраб таймлайна</span>
          <span>${formatTime(playhead)}</span>
        </div>
      `;
      const scrubTrack = document.createElement('div');
      scrubTrack.className = 'scrub-track';
      const thumb = document.createElement('div');
      thumb.className = 'scrub-thumb';
      thumb.style.left = `${(playhead / DURATION) * 100}%`;
      scrubTrack.appendChild(thumb);

      scrubTrack.addEventListener('pointerdown', (e) => {
        const rect = scrubTrack.getBoundingClientRect();
        function update(me) {
          const pct = Math.max(0, Math.min(1, (me.clientX - rect.left) / rect.width));
          playhead = Math.round(pct * DURATION * 10) / 10;
          renderApp();
        }
        update(e);
        function onMove(me) { update(me); }
        function onUp() {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
      scrubStrip.appendChild(scrubTrack);
      wrap.appendChild(scrubStrip);

      // Card List
      const list = document.createElement('div');
      list.className = 'var-c-list';

      layers.forEach(layer => {
        const card = document.createElement('div');
        card.className = `var-c-card ${layer.id === activeLayerId ? 'active' : ''}`;
        
        card.innerHTML = `
          <div>
            <div style="font-weight:600; font-size:13px; color:#fff;">${layer.text}</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
              Показ: ${layer.start.toFixed(1)}с – ${layer.end.toFixed(1)}с (${(layer.end - layer.start).toFixed(1)}с)
            </div>
          </div>
        `;

        const stepper = document.createElement('div');
        stepper.className = 'var-c-stepper';
        
        const btnMinus = document.createElement('button');
        btnMinus.className = 'step-btn';
        btnMinus.textContent = '-';
        btnMinus.title = 'Сдвинуть влево (-0.5с)';
        btnMinus.addEventListener('click', (e) => {
          e.stopPropagation();
          if (layer.start >= 0.5) {
            layer.start -= 0.5;
            layer.end -= 0.5;
            renderApp();
          }
        });

        const btnPlus = document.createElement('button');
        btnPlus.className = 'step-btn';
        btnPlus.textContent = '+';
        btnPlus.title = 'Сдвинуть вправо (+0.5с)';
        btnPlus.addEventListener('click', (e) => {
          e.stopPropagation();
          if (layer.end <= DURATION - 0.5) {
            layer.start += 0.5;
            layer.end += 0.5;
            renderApp();
          }
        });

        stepper.appendChild(btnMinus);
        stepper.appendChild(btnPlus);
        card.appendChild(stepper);

        card.addEventListener('click', () => {
          activeLayerId = layer.id;
          playhead = layer.start;
          renderApp();
        });

        list.appendChild(card);
      });

      wrap.appendChild(list);
      container.appendChild(wrap);
    }

    // Sync Inspector Sheet with Active Layer
    function updateInspector() {
      const activeLayer = getActiveLayer();
      if (!activeLayer) return;

      document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.classList.toggle('active', swatch.dataset.color === activeLayer.color);
      });

      const btnPlate = document.getElementById('toggle-plate');
      btnPlate.textContent = `Плашка: ${activeLayer.plate ? 'Вкл' : 'Выкл'}`;
      btnPlate.classList.toggle('active', activeLayer.plate);

      const btnStroke = document.getElementById('toggle-stroke');
      btnStroke.textContent = `Обводка: ${activeLayer.stroke ? 'Вкл' : 'Выкл'}`;
      btnStroke.classList.toggle('active', activeLayer.stroke);

      const btnFade = document.getElementById('toggle-fade');
      btnFade.textContent = `Fade 1.0s: ${activeLayer.fade ? 'Вкл' : 'Выкл'}`;
      btnFade.classList.toggle('active', activeLayer.fade);

      const btnFont = document.getElementById('btn-font-switch');
      const fontName = activeLayer.font === 'serif' ? 'Serif' : activeLayer.font === 'monospace' ? 'Mono' : 'Sans';
      btnFont.textContent = `Шрифт: ${fontName}`;
    }

    function renderApp() {
      renderStage();
      renderTimeline();
      updateInspector();
    }

    // Color Swatches Click
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        const activeLayer = getActiveLayer();
        activeLayer.color = swatch.dataset.color;
        renderApp();
      });
    });

    // Toggle Buttons
    document.getElementById('toggle-plate').addEventListener('click', () => {
      const activeLayer = getActiveLayer();
      activeLayer.plate = !activeLayer.plate;
      renderApp();
    });

    document.getElementById('toggle-stroke').addEventListener('click', () => {
      const activeLayer = getActiveLayer();
      activeLayer.stroke = !activeLayer.stroke;
      renderApp();
    });

    document.getElementById('toggle-fade').addEventListener('click', () => {
      const activeLayer = getActiveLayer();
      activeLayer.fade = !activeLayer.fade;
      renderApp();
    });

    document.getElementById('btn-font-switch').addEventListener('click', () => {
      const activeLayer = getActiveLayer();
      if (activeLayer.font === 'sans-serif') activeLayer.font = 'serif';
      else if (activeLayer.font === 'serif') activeLayer.font = 'monospace';
      else activeLayer.font = 'sans-serif';
      renderApp();
    });

    // Add Layer Button
    document.getElementById('btn-add-layer').addEventListener('click', () => {
      const newId = layers.length > 0 ? Math.max(...layers.map(l => l.id)) + 1 : 1;
      const start = Math.min(DURATION - 5, playhead);
      const newLayer = {
        id: newId,
        text: `Текст #${newId} ✨`,
        x: 50,
        y: 50 + (newId % 4) * 8,
        start: start,
        end: Math.min(DURATION, start + 6.0),
        color: '#FFFFFF',
        plate: true,
        stroke: false,
        fade: true,
        font: 'sans-serif'
      };
      layers.push(newLayer);
      activeLayerId = newId;
      renderApp();
    });

    // Keyboard Simulation
    const keyboardModal = document.getElementById('keyboard-modal');
    const keyboardInput = document.getElementById('keyboard-input-field');
    const videoViewport = document.getElementById('video-viewport');

    function toggleKeyboard(open) {
      isKeyboardOpen = open !== undefined ? open : !isKeyboardOpen;
      keyboardModal.classList.toggle('open', isKeyboardOpen);
      if (isKeyboardOpen) {
        const activeLayer = getActiveLayer();
        keyboardInput.value = activeLayer.text;
        // Scale video up when keyboard occupies bottom 50%
        videoViewport.style.height = '240px';
        videoViewport.style.width = '135px';
      } else {
        videoViewport.style.height = '400px';
        videoViewport.style.width = '225px';
      }
    }

    document.getElementById('btn-toggle-keyboard').addEventListener('click', () => toggleKeyboard());
    document.getElementById('btn-keyboard-done').addEventListener('click', () => {
      const activeLayer = getActiveLayer();
      activeLayer.text = keyboardInput.value || 'Текст';
      toggleKeyboard(false);
      renderApp();
    });

    keyboardInput.addEventListener('input', (e) => {
      const activeLayer = getActiveLayer();
      activeLayer.text = e.target.value;
      renderStage();
    });

    // Variant Switcher Controls
    function setVariant(vKey) {
      currentVariant = vKey;
      const vObj = variants.find(v => v.key === vKey);
      document.getElementById('var-title').textContent = vObj ? vObj.name : vKey;
      const url = new URL(window.location);
      url.searchParams.set('variant', vKey);
      window.history.replaceState({}, '', url);
      renderApp();
    }

    document.getElementById('var-prev').addEventListener('click', () => {
      const idx = variants.findIndex(v => v.key === currentVariant);
      const nextIdx = (idx - 1 + variants.length) % variants.length;
      setVariant(variants[nextIdx].key);
    });

    document.getElementById('var-next').addEventListener('click', () => {
      const idx = variants.findIndex(v => v.key === currentVariant);
      const nextIdx = (idx + 1) % variants.length;
      setVariant(variants[nextIdx].key);
    });

    // Check URL search param
    const initVar = new URLSearchParams(window.location.search).get('variant') || 'A';
    setVariant(initVar);

    // Initial render
    renderApp();
  </script>
</body>
</html>
